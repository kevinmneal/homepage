name: Check pages and puzzle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify generated pages and discovery files
        run: python3 scripts/build-agent-pages.py --check
      - name: Verify Switchback snapshot and application syntax
        run: |
          python3 scripts/sync-switchback.py --check
          node --check docs/lab/switchback/app.mjs
      - name: Verify tiling playground snapshot
        run: python3 scripts/sync-tiling-playground.py --check
